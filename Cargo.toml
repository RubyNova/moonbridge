[package]
name = "moonbridge"
version = "0.1.0"
edition = "2024"
description = "A Debug Adapter Protocol (DAP) wrapper for Lua."
license = "MIT"
repository = "https://github.com/RubyNova/moonbridge"
readme = "README.md"
exclude = ["nvim.log"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
